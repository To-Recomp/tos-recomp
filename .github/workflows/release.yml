name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-rc.N, published as a pre-release) builds the archives the To-Recomp launcher
# installs (Linux .tar.gz and Windows .zip) and publishes both in one release. A pull request that touches the
# packaging builds them without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "scripts/package-release.sh"
      - "scripts/make-toolkit.sh"
      - "scripts/fetch-zig.sh"
      - "scripts/trim-zig.sh"
      - "prepare/**"
      - "tests/**"

permissions:
  contents: read

# A newer push to a pull request replaces its running build; a tag build is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: tos-recomp
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: To-Recomp/common
          path: common
      - uses: actions/checkout@v4
        with:
          repository: To-Recomp/gcrecomp
          path: gcrecomp
      - uses: actions/checkout@v4
        with:
          repository: To-Recomp/overlay
          path: overlay

      # Build machine only (packaging/linux-build-deps.txt): the static disc codecs for tos-prepare, and the headers SDL3
      # is compiled against (it opens X11, Wayland, ALSA, PulseAudio ... with dlopen at run time, so the player's
      # machine needs none of them).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          grep -v '^#' tos-recomp/packaging/linux-build-deps.txt | xargs sudo apt-get install -y

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-ci.${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # The launcher manifests carry the overlay's shared settings fragments (overlay/tools/sync-manifest.py).
      - name: Manifest check
        run: tos-recomp/tests/manifest-check.sh

      # The pinned Zig (packaging/zig.pin): the compiler that builds the toolkit here and the one packed into tos-prepare.
      - name: Zig
        run: tos-recomp/scripts/fetch-zig.sh --host x86_64-linux --out "$RUNNER_TEMP/zig" --check-index

      - name: Licences of the codecs
        run: |
          mkdir -p codec-licenses
          for pkg in zlib1g:zlib libbz2-1.0:bzip2 liblzma5:liblzma libzstd1:zstd; do
            cp "/usr/share/doc/${pkg%%:*}/copyright" "codec-licenses/${pkg##*:}-copyright.txt"
          done

      - name: Build the archive
        run: |
          zdir="$(ls -d "$RUNNER_TEMP"/zig/zig-x86_64-linux-*/)"
          /usr/bin/time -v tos-recomp/scripts/package-release.sh --version "${{ steps.version.outputs.version }}" --out "$PWD/dist" \
            --jobs 4 --zig-dist "$zdir" --portable --licenses codec-licenses 2> time.log || { cat time.log; exit 1; }
          grep -E 'Elapsed|Maximum resident' time.log

      - name: Check the archive
        run: |
          cd dist && sha256sum -c SHA256SUMS
          ls -l ./*.tar.gz
          tar -tzf ./*.tar.gz | sed 's/^/  /'
          d="$(mktemp -d)" && tar -xzf ./*.tar.gz -C "$d" && p="$(echo "$d"/*)"
          echo "UNPACKED=$p" >> "$GITHUB_ENV"
          "$p/tos-prepare" --version
          "$p/tos-prepare" --help | head -3
          ls -l "$p/tos-prepare"
          # The disc codecs and the C++ runtime must be inside: a distribution may name those libraries differently.
          if ldd "$p/tos-prepare" | grep -E 'libz|libbz2|liblzma|libzstd|libstdc'; then echo "tos-prepare is not self-contained"; exit 1; fi
          # The only libraries it asks for are the C library's.
          ldd "$p/tos-prepare"
          python3 -c "import json,sys;m=json.load(open(sys.argv[1]));assert m['start']['program'] and m['prepare']" "$p/recomplauncher.json"
          # ONE file: the toolkit and the compiler are inside it, not next to it.
          test -x "$p/tos-start" && test -x "$p/tos-prepare"
          test ! -e "$p/toolkit" && test ! -e "$p/toolchain"
          test -f "$p/LICENSE" && test -f "$p/THIRD-PARTY-NOTICES.txt" && for f in Zig-LICENSE.txt LLVM-libcxx-LICENSE.txt SDL3-LICENSE.txt ImGui-LICENSE.txt nlohmann-json-LICENSE.txt overlay-LICENSE.txt OverlayFont-OFL.txt gcrecomp-LICENSE.txt glibc-LICENSES.txt zlib-copyright.txt; do test -f "$p/licenses/$f" || { echo "missing licenses/$f"; exit 1; }; done
          # Nothing derived from a game may be in the archive.
          if tar -tzf ./*.tar.gz | grep -Ei '\.(iso|dol|rel|gcm|rvz)$|generated|extracted'; then echo "game-derived file in the archive"; exit 1; fi

      # The synthetic discs the smoke test reads (no game data), built like tos-prepare: codecs inside, so that it runs in a
      # minimal container.
      - name: Synthetic disc tool
        run: |
          cmake -S tos-recomp/prepare -B build-synth -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DTOS_COMMON_DIR="$PWD/common" \
            -DTOS_PREPARE_STATIC_CODECS=ON -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build-synth --target tos-synth-discs tos_prepare_core

      # The proof that matters: a machine WITHOUT a C++ compiler and WITHOUT network (a plain image, the release mounted
      # read-only, no network) prepares the synthetic discs with the one file and runs the result. Two distributions: the
      # oldest this tos-prepare supports (glibc 2.35) and a current one. docs/RELEASING.md.
      - name: Smoke test of the unpacked archive, no compiler, no network
        run: |
          mkdir -p smoke-work && sudo chown "$(id -u):$(id -g)" smoke-work
          for image in ubuntu:22.04 debian:stable-slim; do
            echo "::group::$image"
            docker run --rm --network none --user "$(id -u):$(id -g)" \
              -v "$PWD/tos-recomp:/src:ro" -v "$UNPACKED:/release:ro" -v "$PWD/build-synth:/synth:ro" -v "$PWD/smoke-work:/work" \
              "$image" bash /src/tests/release-smoke.sh --release /release --synth /synth/tos-synth-discs --work "/work/${image//[:\/]/_}" --keep --no-compiler \
              2>&1 | tee "smoke-${image//[:\/]/_}.log"
            test "${PIPESTATUS[0]}" = 0
            echo "::endgroup::"
          done

      # The same executables, checked on the build machine (which has binutils): only the C library, no glibc newer than 2.31.
      - name: Check the game executable the smoke test built
        run: |
          for g in smoke-work/*/data/bin/tos_boot; do echo "== $g"; tos-recomp/tests/check-linux-game.sh "$g" --glibc 2.31; done
          ls -l smoke-work/*/data/bin/tos_boot

      - name: Sizes and timings
        run: |
          {
            echo "### Linux archive"
            echo '```'
            ls -l dist/*.tar.gz "$UNPACKED/tos-prepare"
            "$UNPACKED/tos-prepare" --version
            grep -h -E '^unpack:|^game executable:|^  log:' smoke-*.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tos-recomp-linux
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          path: tos-recomp
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: To-Recomp/common
          path: common
      - uses: actions/checkout@v4
        with:
          repository: To-Recomp/gcrecomp
          path: gcrecomp
      - uses: actions/checkout@v4
        with:
          repository: To-Recomp/overlay
          path: overlay

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-ci.${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress; if ($LASTEXITCODE -ne 0) { exit 1 } }
          ninja --version

      # tos-prepare.exe: MSVC, static runtime, the disc codecs (zlib, bzip2, liblzma, zstd) linked in from vcpkg,
      # so the player needs nothing installed.
      - name: Disc codecs (static, from vcpkg)
        shell: pwsh
        run: |
          # The sources are downloaded from GitHub and other hosts: retry, a failed download is usually transient.
          foreach ($attempt in 1..3) {
            & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install zlib bzip2 liblzma zstd --triplet x64-windows-static
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit 1 }
            Start-Sleep -Seconds 20
          }
      - name: Build tos-prepare.exe, the payload tool and the synthetic disc tool (MSVC)
        shell: pwsh
        run: |
          cmake -S tos-recomp/prepare -B build-prepare -A x64 -DBUILD_TESTING=OFF -DTOS_COMMON_DIR="$PWD/common" `
            -DTOS_PREPARE_VERSION="${{ steps.version.outputs.version }}" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DTOS_PREPARE_STATIC_CODECS=ON
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build-prepare --config Release --parallel --target tos-prepare tos-payload tos-synth-discs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Licences of the codecs
        run: |
          mkdir -p codec-licenses
          for port in zlib bzip2 liblzma zstd; do
            cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/share/$port/copyright" "codec-licenses/$port-copyright.txt"
          done

      # The pinned Zig (packaging/zig.pin): the compiler that builds the toolkit here, and the one packed into tos-prepare.exe.
      - name: Zig
        run: tos-recomp/scripts/fetch-zig.sh --host x86_64-windows --out "$RUNNER_TEMP/zig" --check-index

      - name: Build the archive
        run: |
          zdir="$(ls -d "$RUNNER_TEMP"/zig/zig-x86_64-windows-*/)"
          start=$SECONDS
          tos-recomp/scripts/package-release.sh --platform windows --version "${{ steps.version.outputs.version }}" \
            --out "$PWD/dist" --jobs 4 --zig-dist "$zdir" --prepare-exe build-prepare/Release/tos-prepare.exe \
            --payload-tool build-prepare/Release/tos-payload.exe --licenses codec-licenses
          echo "packaging took $((SECONDS - start)) s"

      - name: Check the archive
        run: |
          cd dist && sha256sum -c SHA256SUMS
          ls -l ./*.zip
          rm -rf "$RUNNER_TEMP/unpacked" && mkdir "$RUNNER_TEMP/unpacked"
          python -c "import sys,zipfile;z=zipfile.ZipFile(sys.argv[1]);print(len(z.namelist()),'entries');z.extractall(sys.argv[2])" ./*.zip "$RUNNER_TEMP/unpacked"
          p="$(echo "$RUNNER_TEMP"/unpacked/*)"
          ls -l "$p" "$p/licenses"
          "$p/tos-prepare.exe" --version
          "$p/tos-prepare.exe" --help | head -3
          # ONE file: the toolkit and the compiler are inside it, not next to it.
          test ! -e "$p/toolkit" && test ! -e "$p/toolchain"
          d="$(mktemp -d)"
          # No disc and an empty cache: --check unpacks the payload, then says the instance is not prepared yet (exit 10).
          LOCALAPPDATA="$(cygpath -m "$d")" "$p/tos-prepare.exe" --data "$(cygpath -m "$d/data")" --check || test $? = 10
          python -c "import json,sys;m=json.load(open(sys.argv[1]));assert m['start']['program']==['tos-start.exe'] and m['prepare']['program']==['tos-prepare.exe'] and m['prepare']['done']==['{data}/bin/tos_boot.exe']" "$p/recomplauncher.json"
          test -f "$p/tos-start.exe" && test -f "$p/LICENSE" && test -f "$p/THIRD-PARTY-NOTICES.txt"
          for f in Zig-LICENSE.txt LLVM-libcxx-LICENSE.txt SDL3-LICENSE.txt ImGui-LICENSE.txt nlohmann-json-LICENSE.txt overlay-LICENSE.txt OverlayFont-OFL.txt gcrecomp-LICENSE.txt mingw-w64-COPYING.txt zlib-copyright.txt; do test -f "$p/licenses/$f" || { echo "missing licenses/$f"; exit 1; }; done
          # tos-prepare.exe must not need the Visual C++ runtime or any codec DLL.
          deps="$(python - "$p/tos-prepare.exe" <<'PY'
          import re, sys
          data = open(sys.argv[1], "rb").read(8 * 1024 * 1024)
          print("\n".join(sorted({m.decode().lower() for m in re.findall(rb"[A-Za-z0-9_.-]+\.dll", data)})))
          PY
          )"
          echo "$deps"
          if echo "$deps" | grep -Ei 'vcruntime|msvcp|zlib|bz2|lzma|zstd'; then echo "tos-prepare.exe is not self-contained"; exit 1; fi
          # Nothing derived from a game may be in the archive.
          if python -c "import sys,zipfile;print('\n'.join(zipfile.ZipFile(sys.argv[1]).namelist()))" ./*.zip | grep -Ei '\.(iso|dol|rel|gcm|rvz|gcz|ciso|wia|raw)$|/generated/|/extracted/|/game/'; then echo "game-derived file in the archive"; exit 1; fi

      # The unpacked archive on two synthetic disc images, with the C and C++ compilers of the runner OUT of the PATH (Git
      # Bash's own tools only): the real tos-prepare.exe unpacks its payload into %LOCALAPPDATA%, recompiles, compiles with
      # the Zig it carries, links, runs the game, and the later runs skip or repair (docs/RELEASING.md).
      - name: Smoke test of the unpacked archive, no compiler on PATH
        run: |
          p="$(echo "$RUNNER_TEMP"/unpacked/*)"
          PATH="/usr/bin:/c/Windows/System32:/c/Windows" tos-recomp/tests/release-smoke.sh --release "$p" \
            --synth build-prepare/Release/tos-synth-discs.exe --work "$RUNNER_TEMP/smoke" --no-compiler --keep 2>&1 | tee smoke.log
          test "${PIPESTATUS[0]}" = 0
          {
            echo "### Windows archive"
            echo '```'
            ls -l dist/*.zip "$p/tos-prepare.exe"
            grep -h -E '^unpack:|^game executable:|^  log:' smoke.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tos-recomp-windows
          path: dist/*.zip

  # What a release is made of, assembled on every build (pull requests too) so that the publishing step of a tag
  # has nothing left to get wrong: one asset per platform, named as the launcher looks for them, plus SHA256SUMS.
  assets:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tos-recomp-*
          merge-multiple: true
          path: dist
      - name: Assemble
        run: |
          cd dist
          ls -l
          [ "$(ls tos-recomp-*-linux-x86_64.tar.gz | wc -l)" = 1 ] || { echo "expected exactly one Linux archive"; exit 1; }
          [ "$(ls tos-recomp-*-windows-x86_64.zip | wc -l)" = 1 ] || { echo "expected exactly one Windows archive"; exit 1; }
          [ "$(ls | wc -l)" = 2 ] || { echo "unexpected files in the release"; exit 1; }
          sha256sum tos-recomp-* > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          retention-days: 7

  publish:
    if: github.ref_type == 'tag'
    needs: assets
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes)
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "tos-recomp $GITHUB_REF_NAME" "${flags[@]}" dist/*
