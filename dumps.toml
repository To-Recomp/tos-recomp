# Known dumps for Tales of Symphonia (GameCube). Format 1, read by torecomp::Database.
#
# sha1          Whole-image SHA-1 as listed by Redump. A match is "Redump verified".
# content_sha1  Hash of the game's files (see common/include/torecomp/content.hpp). A match is
#               "Compatible": same game data, but the image bytes differ (scrubbed, rebuilt).
#               Regenerate with `torecomp-disc manifest <disc.iso>`.
#
# The content_sha1 values below were computed from Redump-verified images (whole-image SHA-1 equal to the
# `sha1` of the entry) with `torecomp-disc manifest`. They replace values taken from an older dump whose
# SHA-1 does not match Redump: 14 of its big files (BTL/btlvoice.afs, three BTL/v_*.snd, the eight
# EV/sce_*.afs, MOV/op.h4m, MOV/s01.h4m) differ from the verified image, so that dump is not the retail data.

format = 1

