# Known dumps for Tales of Symphonia (GameCube). Format 1, read by torecomp::Database.
#
# sha1          Whole-image SHA-1 as listed by Redump. A match is "Redump verified".
# content_sha1  Hash of the game's files (see common/include/torecomp/content.hpp). A match is
#               "Compatible": same game data, but the image bytes differ (scrubbed, rebuilt).
#               Regenerate with `torecomp-disc manifest <disc.iso>`.
#
# The content_sha1 values below were computed from Redump-verified images (whole-image SHA-1 equal to the
# `sha1` of the entry) with `torecomp-disc manifest`. They replace values taken from an older dump whose
# SHA-1 does not match Redump: 14 of its big files (BTL/btlvoice.afs, three BTL/v_*.snd, the eight
# EV/sce_*.afs, MOV/op.h4m, MOV/s01.h4m) differ from the verified image, so that dump is not the retail data.

format = 1

[[release]]
id = "gqsf"
platform = "gamecube"
region = "France (PAL)"
title = "Tales of Symphonia (France)"
status = "alpha"         # boots, plays through the first battles (docs/m2-findings.md); disc 2 untested
tested = true            # played by the owner on the real discs

[[release.disc]]
game_id = "GQSF"
disc = 0
version = 0
size = 1459978240
title = "Tales of Symphonia (France) (Disc 1)"
redump_id = 6511
serial = "DL-DOL-GQSF-0-FRA"
sha1 = "d38365eb13f09f185b058826ec3f45e6e1118e66"
content_sha1 = "6b3a61249783be93ae1880fc90eb36dd0cd8f079"

[[release.disc]]
game_id = "GQSF"
disc = 1
version = 0
size = 1459978240
title = "Tales of Symphonia (France) (Disc 2)"
redump_id = 6512
serial = "DL-DOL-GQSF-1-FRA"
sha1 = "d66b673c9979be546c2253b5de96337981273335"
content_sha1 = "a3c22ec688780cf92162953623358f18b9f515c1"

# The releases below come from Redump (serial, entry, size, whole-image SHA-1); their content_sha1 were computed
# (scripts/disc-hashes.sh) from images whose whole-image SHA-1 equals the Redump one, read as ISO, 7z (Japan) and RVZ
# (USA). Every header has version 0. None has symbols or a recompile: unlike the French release, each has its own
# main.dol (all different from the French one, as are all their .rel files), so the code and symbols of this build
# (GQSF) do not apply to them. They stay unsupported until someone tests them.

